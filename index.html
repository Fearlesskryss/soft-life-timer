<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">
  <title>Soft Life Timer</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
<main class="timer-app">

  <h1> ✨Soft Life Timer ✨</h1>
  <p class="subtitle">
    A little productivity corner for you.
  </p>

  <div class="timer-display" id="timer">
    25:00
  </div>
  <p id="message"></p>

  <div class="buttons">
    <button id="startButton">Start</button>
    <button id="pauseButton">Pause</button>
    <button id="resetButton">Reset</button>
  </div>

  <h2>Choose your Vibe 💕</h2>

  <div class="presets">

    <button class="preset" data-minutes="5">
      ☕️ Tea Time
    </button>
    <button class="preset" data-minutes="10">
      🧘‍♀️ Reset
    </button>
    <button class="preset" data-minutes="25">
      💻 Focus
    </button>
    <button class="preset" data-minutes="45">
      📚Study
    </button>

  </div>
</main>
<script src="js/app.js"></script>
</body>
</html>
